services:
  - type: web
    name: roomreserve-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node database/seed.js && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roomreserve-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: roomreserve-db
    plan: free
    databaseName: roomreserve_db
    user: roomreserve_user
